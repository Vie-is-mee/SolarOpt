<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <defs>
    <!-- Tile pattern for main roof -->
    <pattern id="tile-main" width="18" height="14" patternUnits="userSpaceOnUse">
      <rect width="18" height="14" fill="#c0623a"/>
      <rect x="0" y="0" width="18" height="7" fill="#b85a34"/>
      <line x1="0" y1="7" x2="18" y2="7" stroke="#a04828" stroke-width="0.5"/>
      <line x1="9" y1="0" x2="9" y2="14" stroke="#a04828" stroke-width="0.4"/>
      <rect x="1" y="1" width="7" height="5" rx="1" fill="#c86840" opacity="0.4"/>
    </pattern>
    <!-- Tile pattern for annex -->
    <pattern id="tile-annex" width="18" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="18" height="14" fill="#b85a34"/>
      <rect x="0" y="0" width="18" height="7" fill="#b05030"/>
      <line x1="0" y1="7" x2="18" y2="7" stroke="#904020" stroke-width="0.5"/>
      <line x1="9" y1="0" x2="9" y2="14" stroke="#904020" stroke-width="0.4"/>
    </pattern>
    <!-- Concrete / flat surface -->
    <pattern id="concrete" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#d4cec8"/>
      <rect x="0" y="0" width="10" height="10" fill="#ccc8c2"/>
      <rect x="10" y="10" width="10" height="10" fill="#ccc8c2"/>
    </pattern>
    <!-- Tree foliage texture -->
    <radialGradient id="tree1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4a7c30"/>
      <stop offset="60%" stop-color="#3a6a22"/>
      <stop offset="100%" stop-color="#2a5018"/>
    </radialGradient>
    <radialGradient id="tree2" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#5a8c38"/>
      <stop offset="60%" stop-color="#3d7025"/>
      <stop offset="100%" stop-color="#2a5018"/>
    </radialGradient>
    <radialGradient id="tree3" cx="55%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#527829"/>
      <stop offset="100%" stop-color="#2a5018"/>
    </radialGradient>
    <!-- Road texture -->
    <pattern id="road" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#7a7870"/>
    </pattern>
    <!-- Sky/surroundings -->
    <radialGradient id="surround" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3a5c2a"/>
      <stop offset="100%" stop-color="#2a4a1a"/>
    </radialGradient>
    <!-- Shadow gradients -->
    <linearGradient id="shadow-east" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadow-south" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Lens vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- ===== SURROUNDINGS ===== -->
  <!-- Ground / neighborhood base -->
  <rect width="1000" height="750" fill="#4a6a35"/>

  <!-- Road (south bottom) -->
  <rect x="0" y="640" width="1000" height="110" fill="#6a6860"/>
  <!-- Road markings -->
  <line x1="0" y1="695" x2="1000" y2="695" stroke="#e8d850" stroke-width="2" stroke-dasharray="40 20"/>
  <!-- Sidewalk -->
  <rect x="0" y="625" width="1000" height="18" fill="#a09888"/>

  <!-- Road (west left) -->
  <rect x="0" y="0" width="80" height="750" fill="#6a6860"/>
  <rect x="78" y="0" width="18" height="750" fill="#a09888"/>

  <!-- Neighboring structures (blurred / distant) -->
  <rect x="85" y="0" width="160" height="200" fill="#c8c4bc" opacity="0.6" rx="2"/>
  <rect x="100" y="15" width="130" height="175" fill="url(#tile-annex)" opacity="0.5"/>

  <rect x="700" y="0" width="300" height="250" fill="#c0bbb4" opacity="0.5" rx="2"/>
  <rect x="710" y="10" width="280" height="230" fill="url(#tile-main)" opacity="0.4"/>

  <rect x="85" y="430" width="200" height="200" fill="#c0c0b8" opacity="0.5" rx="2"/>

  <!-- Grass/garden areas -->
  <rect x="85" y="200" width="50" height="430" fill="#5a7a3a"/>
  <ellipse cx="110" cy="280" rx="28" ry="24" fill="url(#tree1)"/>
  <ellipse cx="110" cy="380" rx="22" ry="20" fill="url(#tree2)"/>
  <ellipse cx="108" cy="460" rx="25" ry="22" fill="url(#tree1)"/>

  <!-- ===== MAIN HOUSE STRUCTURE ===== -->

  <!-- House footprint shadow (ground shadow offset) -->
  <rect x="215" y="115" width="560" height="425" fill="#000" opacity="0.15" rx="3"/>

  <!-- House lot boundary (concrete surroundings) -->
  <rect x="175" y="85" width="640" height="475" fill="#c8c2ba" rx="2"/>

  <!-- Garden / greenery around house -->
  <rect x="175" y="85" width="640" height="475" fill="#527a30" rx="2"/>

  <!-- ===== MAIN ROOF ===== -->
  <!-- Roof tile surface - main body -->
  <rect x="210" y="100" width="555" height="445" fill="url(#tile-main)" rx="2"/>

  <!-- Hip roof shading - west slope (slightly lighter) -->
  <polygon points="210,100 390,290 210,490" fill="#d07045" opacity="0.25"/>
  <!-- Hip roof shading - east slope (darker) -->
  <polygon points="765,100 585,290 765,545" fill="#000" opacity="0.2"/>
  <!-- Hip roof shading - south slope -->
  <polygon points="210,545 765,545 585,290 390,290" fill="#000" opacity="0.08"/>

  <!-- Ridge line (horizontal) -->
  <rect x="355" y="286" width="250" height="8" fill="#f0dcc8" rx="4"/>
  <!-- Ridge lines diagonal -->
  <line x1="210" y1="100" x2="355" y2="290" stroke="#e8d0b8" stroke-width="3"/>
  <line x1="765" y1="100" x2="605" y2="290" stroke="#c0a080" stroke-width="3"/>
  <line x1="210" y1="545" x2="355" y2="290" stroke="#c0a080" stroke-width="3"/>
  <line x1="765" y1="545" x2="605" y2="290" stroke="#905030" stroke-width="3"/>

  <!-- Roof edge highlights -->
  <rect x="210" y="100" width="555" height="5" fill="#e8c8a0" opacity="0.7"/>
  <rect x="210" y="100" width="4" height="445" fill="#e8c8a0" opacity="0.5"/>

  <!-- ===== ANNEX WING (right) ===== -->
  <rect x="765" y="280" width="130" height="190" fill="url(#tile-annex)" rx="1"/>
  <polygon points="765,280 830,360 765,450" fill="#c07040" opacity="0.3"/>
  <polygon points="895,280 830,360 895,450" fill="#000" opacity="0.2"/>
  <line x1="765" y1="280" x2="830" y2="365" stroke="#d4b080" stroke-width="2.5"/>
  <line x1="895" y1="280" x2="830" y2="365" stroke="#a07040" stroke-width="2.5"/>
  <line x1="765" y1="450" x2="830" y2="365" stroke="#a07040" stroke-width="2.5"/>
  <line x1="895" y1="450" x2="830" y2="365" stroke="#804020" stroke-width="2.5"/>
  <!-- Annex ridge -->
  <circle cx="830" cy="365" r="4" fill="#e8d0b0"/>

  <!-- ===== OBSTACLES ON ROOF ===== -->

  <!-- === BỒN NƯỚC (Water tank) === -->
  <g>
    <!-- Tank shadow -->
    <ellipse cx="588" cy="200" rx="50" ry="48" fill="#000" opacity="0.3"/>
    <!-- Tank body (cylinder top view) -->
    <ellipse cx="578" cy="192" rx="50" ry="48" fill="#7a9ab0"/>
    <ellipse cx="578" cy="192" rx="42" ry="40" fill="#8aaac0"/>
    <!-- Tank top highlight -->
    <ellipse cx="572" cy="185" rx="22" ry="18" fill="#aacce0" opacity="0.8"/>
    <ellipse cx="568" cy="182" rx="10" ry="7" fill="#c8e4f4" opacity="0.9"/>
    <!-- Tank rim -->
    <ellipse cx="578" cy="192" rx="50" ry="48" fill="none" stroke="#5a8aaa" stroke-width="2.5"/>
    <ellipse cx="578" cy="192" rx="42" ry="40" fill="none" stroke="#6a9aba" stroke-width="1.5"/>
    <!-- Support legs shadow -->
    <line x1="558" y1="232" x2="548" y2="248" stroke="#4a6a80" stroke-width="3"/>
    <line x1="578" y1="238" x2="578" y2="252" stroke="#4a6a80" stroke-width="3"/>
    <line x1="598" y1="232" x2="608" y2="248" stroke="#4a6a80" stroke-width="3"/>
    <!-- Label overlay -->
    <rect x="540" y="250" width="80" height="18" fill="#0a1a2a" fill-opacity="0.7" rx="3"/>
    <text x="580" y="263" font-family="Arial, sans-serif" font-size="11" fill="#ffd080" text-anchor="middle" font-weight="bold">BỒN NƯỚC</text>
  </g>

  <!-- === ỐNG THÔNG GIÓ (Ventilation pipe) === -->
  <g>
    <!-- Pipe shadow -->
    <rect x="307" y="348" width="56" height="56" rx="4" fill="#000" opacity="0.25"/>
    <!-- Pipe base -->
    <rect x="300" y="342" width="56" height="56" rx="4" fill="#888880"/>
    <!-- Pipe center -->
    <rect x="308" y="350" width="40" height="40" rx="3" fill="#6a6a68"/>
    <circle cx="328" cy="370" r="16" fill="#555550"/>
    <circle cx="328" cy="370" r="10" fill="#333330"/>
    <circle cx="328" cy="370" r="5" fill="#222220"/>
    <!-- Highlight -->
    <circle cx="323" cy="364" r="3" fill="#888884" opacity="0.7"/>
    <!-- Label -->
    <rect x="282" y="408" width="92" height="18" fill="#0a1a2a" fill-opacity="0.7" rx="3"/>
    <text x="328" y="421" font-family="Arial, sans-serif" font-size="10" fill="#80d0a0" text-anchor="middle" font-weight="bold">THÔNG GIÓ</text>
  </g>

  <!-- === DÀN NÓNG (AC unit in annex) === -->
  <g>
    <!-- Unit shadow -->
    <rect x="782" y="312" width="96" height="72" rx="3" fill="#000" opacity="0.3"/>
    <!-- Unit body -->
    <rect x="776" y="306" width="96" height="72" rx="3" fill="#d0d0cc"/>
    <rect x="780" y="310" width="88" height="64" rx="2" fill="#c8c8c4"/>
    <!-- Fins (horizontal slats) -->
    <line x1="780" y1="320" x2="868" y2="320" stroke="#aaa" stroke-width="1.2"/>
    <line x1="780" y1="328" x2="868" y2="328" stroke="#aaa" stroke-width="1.2"/>
    <line x1="780" y1="336" x2="868" y2="336" stroke="#aaa" stroke-width="1.2"/>
    <line x1="780" y1="344" x2="868" y2="344" stroke="#aaa" stroke-width="1.2"/>
    <line x1="780" y1="352" x2="868" y2="352" stroke="#aaa" stroke-width="1.2"/>
    <line x1="780" y1="360" x2="868" y2="360" stroke="#aaa" stroke-width="1.2"/>
    <!-- Fan circle -->
    <circle cx="840" cy="338" r="18" fill="#b0b0ac" stroke="#888" stroke-width="1.5"/>
    <circle cx="840" cy="338" r="12" fill="#a0a09c"/>
    <circle cx="840" cy="338" r="4" fill="#888884"/>
    <!-- Label -->
    <rect x="782" y="384" width="80" height="18" fill="#0a1a2a" fill-opacity="0.7" rx="3"/>
    <text x="822" y="397" font-family="Arial, sans-serif" font-size="10" fill="#ffd080" text-anchor="middle" font-weight="bold">DÀN NÓNG</text>
  </g>

  <!-- === VẬT THỂ A? (unknown object) === -->
  <g>
    <rect x="423" y="442" width="102" height="58" rx="2" fill="#000" opacity="0.25"/>
    <rect x="418" y="436" width="102" height="58" rx="2" fill="#8a7060"/>
    <rect x="424" y="442" width="90" height="46" rx="1" fill="#7a6050"/>
    <!-- Unknown pattern -->
    <line x1="418" y1="436" x2="520" y2="494" stroke="#9a8070" stroke-width="1.5"/>
    <line x1="520" y1="436" x2="418" y2="494" stroke="#9a8070" stroke-width="1.5"/>
    <text x="469" y="468" font-family="Arial, sans-serif" font-size="13" fill="#ffdd80" text-anchor="middle" font-weight="bold">?</text>
    <rect x="418" y="500" width="100" height="18" fill="#0a1a2a" fill-opacity="0.7" rx="3"/>
    <text x="468" y="513" font-family="Arial, sans-serif" font-size="10" fill="#ffb060" text-anchor="middle" font-weight="bold">VẬT THỂ A?</text>
  </g>

  <!-- ===== TREES around house ===== -->
  <!-- Tree cluster NW -->
  <ellipse cx="220" cy="130" rx="34" ry="30" fill="url(#tree1)"/>
  <ellipse cx="255" cy="115" rx="26" ry="23" fill="url(#tree2)"/>
  <!-- Tree cluster NE -->
  <ellipse cx="730" cy="120" rx="32" ry="28" fill="url(#tree2)"/>
  <ellipse cx="760" cy="140" rx="22" ry="19" fill="url(#tree1)"/>
  <!-- Tree cluster SW -->
  <ellipse cx="220" cy="510" rx="30" ry="26" fill="url(#tree3)"/>
  <ellipse cx="250" cy="540" rx="24" ry="22" fill="url(#tree1)"/>
  <!-- Tree cluster SE -->
  <ellipse cx="730" cy="520" rx="28" ry="25" fill="url(#tree2)"/>
  <ellipse cx="755" cy="545" rx="20" ry="18" fill="url(#tree3)"/>
  <!-- South garden trees -->
  <ellipse cx="380" cy="575" rx="28" ry="24" fill="url(#tree1)"/>
  <ellipse cx="490" cy="590" rx="24" ry="21" fill="url(#tree2)"/>
  <ellipse cx="600" cy="575" rx="26" ry="22" fill="url(#tree1)"/>

  <!-- ===== PHOTO METADATA OVERLAY ===== -->
  <!-- Telemetry bar (top) -->
  <rect x="0" y="0" width="1000" height="36" fill="#000" fill-opacity="0.65"/>
  <text x="15" y="23" font-family="'Courier New', monospace" font-size="12" fill="#00ff88">REC ●</text>
  <text x="70" y="23" font-family="'Courier New', monospace" font-size="12" fill="#ffffff">DJI Mini 4 Pro   |   4K/30fps   |   EV +0.3   |   ISO 100   |   1/800s</text>
  <text x="700" y="23" font-family="'Courier New', monospace" font-size="12" fill="#a0d0ff">Alt: 38.5m   |   Spd: 0.0 m/s   |   Gnd: 0.2km</text>
  <text x="880" y="23" font-family="'Courier New', monospace" font-size="12" fill="#ffdd44">GPS: LOCK</text>

  <!-- Telemetry bar (bottom) -->
  <rect x="0" y="718" width="1000" height="32" fill="#000" fill-opacity="0.65"/>
  <text x="15" y="738" font-family="'Courier New', monospace" font-size="11" fill="#a0d0ff">10°46'33"N  106°42'4"E</text>
  <text x="240" y="738" font-family="'Courier New', monospace" font-size="11" fill="#ffffff">Heading: 178° (S)   |   Gimbal: -90°   |   Dist: 0m</text>
  <text x="650" y="738" font-family="'Courier New', monospace" font-size="11" fill="#c0c0c0">18-04-2024  09:34:22</text>
  <text x="820" y="738" font-family="'Courier New', monospace" font-size="11" fill="#80ff80">Batt: 84%</text>
  <text x="900" y="738" font-family="'Courier New', monospace" font-size="11" fill="#ffaa44">TP.HCM</text>

  <!-- Crosshair center -->
  <g opacity="0.45">
    <line x1="490" y1="355" x2="510" y2="355" stroke="#fff" stroke-width="1.2"/>
    <line x1="500" y1="345" x2="500" y2="365" stroke="#fff" stroke-width="1.2"/>
    <circle cx="500" cy="355" r="20" fill="none" stroke="#fff" stroke-width="0.8"/>
  </g>

  <!-- North compass (top right) -->
  <g transform="translate(950, 75)">
    <circle cx="0" cy="0" r="22" fill="#000" fill-opacity="0.5" stroke="#ffffff" stroke-width="1"/>
    <polygon points="0,-16 4,2 0,0 -4,2" fill="#ffffff"/>
    <polygon points="0,16 4,-2 0,0 -4,-2" fill="#888"/>
    <text y="-18" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">N</text>
  </g>

  <!-- Reference measurement overlay -->
  <line x1="260" y1="58" x2="540" y2="58" stroke="#ffdd44" stroke-width="1.5" marker-end="url(#arr-yellow)" marker-start="url(#arr-yellow)"/>
  <defs>
    <marker id="arr-yellow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffdd44"/>
    </marker>
  </defs>
  <line x1="260" y1="52" x2="260" y2="66" stroke="#ffdd44" stroke-width="1"/>
  <line x1="540" y1="52" x2="540" y2="66" stroke="#ffdd44" stroke-width="1"/>
  <rect x="358" y="44" width="86" height="18" fill="#000" fill-opacity="0.6" rx="3"/>
  <text x="401" y="57" font-family="'Courier New', monospace" font-size="11" fill="#ffdd44" text-anchor="middle">≈ 5.40 m</text>

  <!-- Vignette overlay (lens effect) -->
  <rect width="1000" height="750" fill="url(#vignette)"/>

  <!-- Subtle film grain texture via filter -->
  <rect width="1000" height="750" fill="none" opacity="0.04">
    <animate attributeName="opacity" values="0.03;0.05;0.03" dur="0.1s" repeatCount="indefinite"/>
  </rect>
</svg>
